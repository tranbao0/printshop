name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tests the lowest Node version that the package supports (see engines in package.json) and the version that the profile Action uses.
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.2.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      # The package from the signed Ubuntu archive; the frame sheet test needs ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx tsc -p .
      # The declaration files in types/ are generated from the JSDoc and committed. They must match the source.
      - run: npm run types:check
      - run: node --test

  # One check with a fixed name for the branch rules of `main`, so the Node versions can change without a change to the rules.
  test:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
