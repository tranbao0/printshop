<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example page</title>
<style>
  html, body { margin: 0; background: #fff; }
  #page { position: relative; width: 100%; height: 500px; overflow: hidden; background: #fff; }
  .shape { position: absolute; }
  .disc { border-radius: 50%; }
  .ramp { left: 40px; top: 410px; width: 720px; height: 60px; background: linear-gradient(90deg, #000, #fff); }
  .bar { left: 60px; top: 60px; width: 300px; height: 90px; background: #222; transform: rotate(-4deg); }
  .frame { left: 440px; top: 50px; width: 260px; height: 140px; border: 10px solid #000; background: #fff; }
  .a { left: 80px; top: 225px; width: 160px; height: 160px; background: #444; }
  .b { left: 300px; top: 225px; width: 160px; height: 160px; background: #777; }
  .c { left: 520px; top: 225px; width: 160px; height: 160px; background: radial-gradient(closest-side, #000, #fff); }
</style>
</head>
<body>
<!-- The core renders the element #page, after the page sets the attribute data-ready on the body. Set it when fonts and images are loaded. -->
<div id="page">
  <div class="shape bar"></div>
  <div class="shape frame"></div>
  <div class="shape disc a"></div>
  <div class="shape disc b"></div>
  <div class="shape disc c"></div>
  <div class="shape ramp"></div>
</div>
<script>
  document.fonts.ready.then(() => document.body.setAttribute('data-ready', ''));
</script>
</body>
</html>
